# Pack scenarios: one small graph each, judged under every pack in rules/
# (`ubo eval --suite packs`; schema in src/ubo_sentinel/rules/pack_scenarios.py).
# A designation's `list` is `own` (the pack's own list) or `other` (a list no
# pack applies), so one graph reads the same way under every pack. Every pack in
# rules/ must be stated for every scenario. The UK and EU packs are illustrative.
- id: PACK-01
  title: a designated owner of exactly half
  target: T
  edges:
    - {upper: A, lower: T, pct: 50}
  designations:
    - {node: A}
  expected:
    ofac: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, T]}
    uk_ofsi: {recommendation: REVIEW, reasons: [EFFECTIVE_EXPOSURE, NEAR_MISS_AGGREGATE], blocked: [A]}
    eu: {recommendation: REVIEW, reasons: [EFFECTIVE_EXPOSURE, NEAR_MISS_AGGREGATE], blocked: [A]}
  rationale: >-
    OFAC blocks at 50 percent or more; the UK and EU tests need more than half.
    Under them the stake is a near miss and a large exposure, so a reviewer sees it.

- id: PACK-02
  title: a designated owner of just over half
  target: T
  edges:
    - {upper: A, lower: T, pct: "50.0001"}
  designations:
    - {node: A}
  expected:
    ofac: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, T]}
    uk_ofsi: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, T]}
    eu: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, T]}
  rationale: More than half meets every pack's test.

- id: PACK-03
  title: two designated owners of 30 % each
  target: T
  edges:
    - {upper: A, lower: T, pct: 30}
    - {upper: B, lower: T, pct: 30}
  designations:
    - {node: A}
    - {node: B}
  expected:
    ofac: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, B, T]}
    uk_ofsi: {recommendation: REVIEW, reasons: [EFFECTIVE_EXPOSURE], blocked: [A, B]}
    eu: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, B, T]}
  rationale: >-
    OFAC adds the holdings of blocked persons together (60 %). The UK pack tests
    the largest holding (30 %), so only the exposure sends it to a reviewer. The
    EU pack adds them, an assumption for counsel stated in rules/eu.yaml.

- id: PACK-04
  title: two designated owners of 25 % each
  target: T
  edges:
    - {upper: A, lower: T, pct: 25}
    - {upper: B, lower: T, pct: 25}
  designations:
    - {node: A}
    - {node: B}
  expected:
    ofac: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, B, T]}
    uk_ofsi: {recommendation: REVIEW, reasons: [EFFECTIVE_EXPOSURE], blocked: [A, B]}
    eu: {recommendation: REVIEW, reasons: [EFFECTIVE_EXPOSURE, NEAR_MISS_AGGREGATE], blocked: [A, B]}
  rationale: >-
    Together exactly half: OFAC's ">=" blocks; the EU's ">" does not, and the
    aggregate is a near miss; the UK pack tests 25 % alone.

- id: PACK-05
  title: indirect majority ownership
  target: T
  edges:
    - {upper: A, lower: M, pct: 60}
    - {upper: M, lower: T, pct: 90}
  designations:
    - {node: A}
  expected:
    ofac: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, M, T]}
    uk_ofsi: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, M, T]}
    eu: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, M, T]}
  rationale: >-
    The owned entity is itself blocked, and it owns the target outright; every
    pack follows ownership down the chain.

- id: PACK-06
  title: a designated controller and no ownership
  target: T
  edges:
    - {upper: A, lower: T, rel: CONTROLS}
  designations:
    - {node: A}
  expected:
    ofac: {recommendation: REVIEW, reasons: [CONTROL_LINK], blocked: [A]}
    uk_ofsi: {recommendation: REVIEW, reasons: [CONTROL_LINK], blocked: [A]}
    eu: {recommendation: REVIEW, reasons: [CONTROL_LINK], blocked: [A]}
  rationale: >-
    OFAC's rule is ownership only; control is a risk for review. The UK and EU
    tests treat control as designation, which these packs cannot express: the
    gap their label states. A reviewer sees it under every pack; none clears it.

- id: PACK-07
  title: a majority owner designated on another regime's list
  target: T
  edges:
    - {upper: A, lower: T, pct: 60}
  designations:
    - {node: A, list: other}
  expected:
    ofac: {recommendation: REVIEW, reasons: [OTHER_REGIME_DESIGNATION]}
    uk_ofsi: {recommendation: REVIEW, reasons: [OTHER_REGIME_DESIGNATION]}
    eu: {recommendation: REVIEW, reasons: [OTHER_REGIME_DESIGNATION]}
  rationale: >-
    Another regime's designation never blocks under a pack; it would meet the
    pack's own test, so it is sent for review.

- id: PACK-08
  title: a review-band name match on a majority owner
  target: T
  edges:
    - {upper: A, lower: T, pct: 60}
  designations:
    - {node: A, by: Y, confidence: 0.88}
  expected:
    ofac: {recommendation: REVIEW, reasons: [DECISION_RELEVANT_GAP, POSSIBLY_BLOCKED], possibly_blocked: [A, T], gaps: [REVIEW_BAND_MATCH]}
    uk_ofsi: {recommendation: REVIEW, reasons: [DECISION_RELEVANT_GAP, POSSIBLY_BLOCKED], possibly_blocked: [A, T], gaps: [REVIEW_BAND_MATCH]}
    eu: {recommendation: REVIEW, reasons: [DECISION_RELEVANT_GAP, POSSIBLY_BLOCKED], possibly_blocked: [A, T], gaps: [REVIEW_BAND_MATCH]}
  rationale: An unsettled match is the same under every pack; the reviewer settles it.

- id: PACK-09
  title: a small designated stake
  target: T
  edges:
    - {upper: A, lower: T, pct: 10}
  designations:
    - {node: A}
  expected:
    ofac: {recommendation: CLEAR, blocked: [A]}
    uk_ofsi: {recommendation: CLEAR, blocked: [A]}
    eu: {recommendation: CLEAR, blocked: [A]}
  rationale: Below every threshold and every risk signal.

# --- Step 16: stakes stated as ranges, and votes. A range meets a test only when
# every value in it does; when only some do, the holder is possibly blocked. The
# UK and EU packs test votes as well as shares; OFAC tests shares, and reviews a
# voting stake that could meet its threshold as a control link.
- id: PACK-10
  title: a designated owner of more than 25 % and at most 50 %
  target: T
  edges:
    - {upper: A, lower: T, range: "(25, 50]"}
  designations:
    - {node: A}
  expected:
    ofac: {recommendation: REVIEW, reasons: [DECISION_RELEVANT_GAP, EFFECTIVE_EXPOSURE, NEAR_MISS_AGGREGATE, POSSIBLY_BLOCKED], blocked: [A], possibly_blocked: [T], gaps: [PCT_RANGE]}
    uk_ofsi: {recommendation: REVIEW, reasons: [EFFECTIVE_EXPOSURE, NEAR_MISS_AGGREGATE], blocked: [A], gaps: [PCT_RANGE]}
    eu: {recommendation: REVIEW, reasons: [EFFECTIVE_EXPOSURE, NEAR_MISS_AGGREGATE], blocked: [A], gaps: [PCT_RANGE]}
  rationale: >-
    The stake may be exactly half, which OFAC's ">=" blocks, or less: possibly
    blocked, and the range is the gap that decides. No value of it is more than
    half, so the UK and EU tests are not met; as for 50 % stated (PACK-01), the
    stake is a near miss and a large exposure, so a reviewer sees it.

- id: PACK-11
  title: a designated owner of more than half and less than 75 %
  target: T
  edges:
    - {upper: A, lower: T, range: "(50, 75)"}
  designations:
    - {node: A}
  expected:
    ofac: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, T], gaps: [PCT_RANGE]}
    uk_ofsi: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, T], gaps: [PCT_RANGE]}
    eu: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, T], gaps: [PCT_RANGE]}
  rationale: Every value of the range is more than half, so every pack's test is met.

- id: PACK-12
  title: a designated owner of 75 % to 100 %
  target: T
  edges:
    - {upper: A, lower: T, range: "[75, 100]"}
  designations:
    - {node: A}
  expected:
    ofac: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, T], gaps: [PCT_RANGE]}
    uk_ofsi: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, T], gaps: [PCT_RANGE]}
    eu: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, T], gaps: [PCT_RANGE]}
  rationale: The register's top band; the range is recorded, and it decides nothing.

- id: PACK-13
  title: two designated owners of more than 25 % and at most 50 % each
  target: T
  edges:
    - {upper: A, lower: T, range: "(25, 50]"}
    - {upper: B, lower: T, range: "(25, 50]"}
  designations:
    - {node: A}
    - {node: B}
  expected:
    ofac: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, B, T], gaps: [PCT_RANGE]}
    uk_ofsi: {recommendation: REVIEW, reasons: [EFFECTIVE_EXPOSURE, NEAR_MISS_AGGREGATE], blocked: [A, B], gaps: [PCT_RANGE]}
    eu: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, B, T], gaps: [PCT_RANGE]}
  rationale: >-
    Added together the two hold more than half and at most all of it, and every
    value of that meets OFAC's and the EU's test. The UK pack tests the largest
    holding alone, which may be half and no more: a near miss for review.

- id: PACK-14
  title: a designated owner of 10 % of the shares and 60 % of the votes
  target: T
  edges:
    - {upper: A, lower: T, pct: 10}
    - {upper: A, lower: T, pct: 60, interest: voting}
  designations:
    - {node: A}
  expected:
    ofac: {recommendation: REVIEW, reasons: [CONTROL_LINK], blocked: [A]}
    uk_ofsi: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, T]}
    eu: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, T]}
  rationale: >-
    The UK and EU tests count voting rights, and a majority of the votes meets
    them. OFAC's rule is ownership of shares; a voting majority is control, sent
    for review, never a block.

- id: PACK-15
  title: a range on a holder no designated party reaches
  target: T
  edges:
    - {upper: A, lower: T, pct: 10}
    - {upper: X, lower: T, range: "(25, 50]"}
  designations:
    - {node: A}
  expected:
    ofac: {recommendation: CLEAR, blocked: [A], gaps: [PCT_RANGE]}
    uk_ofsi: {recommendation: CLEAR, blocked: [A], gaps: [PCT_RANGE]}
    eu: {recommendation: CLEAR, blocked: [A], gaps: [PCT_RANGE]}
  rationale: >-
    The range is on an owner that is not designated and not on any blocked
    party's path, so it decides nothing: a gap for information only.

# --- Step 20: packs that define regimes. A designation's `program` is read by a
# pack's `programs`; a CONTROLS edge's `basis` by its `control_blocks`; a
# RELATED_TO edge (family, associate) by its `aggregate_related`. The UK and EU
# packs review `*SECTORAL*` programs, ignore `*TRAVEL*` ones and block on the
# right to appoint the board; OFAC blocks every program and no control.
- id: PACK-20
  title: a sectoral program over a wholly owned subsidiary
  target: T
  edges:
    - {upper: A, lower: T, pct: 100}
  designations:
    - {node: A, program: FX-SECTORAL}
  expected:
    ofac: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, T]}
    uk_ofsi: {recommendation: REVIEW, reasons: [POSSIBLY_BLOCKED], possibly_blocked: [A, T]}
    eu: {recommendation: REVIEW, reasons: [POSSIBLY_BLOCKED], possibly_blocked: [A, T]}
  rationale: >-
    A program the UK and EU packs review seeds the possibly-blocked set only, so
    the subsidiary it wholly owns is possibly blocked, for a reviewer. OFAC
    blocks every program on its list.

- id: PACK-21
  title: an ignored program over a wholly owned subsidiary
  target: T
  edges:
    - {upper: A, lower: T, pct: 100}
  designations:
    - {node: A, program: FX-TRAVEL-BAN}
  expected:
    ofac: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, T]}
    uk_ofsi: {recommendation: CLEAR, gaps: [PROGRAM_NOT_APPLIED]}
    eu: {recommendation: CLEAR, gaps: [PROGRAM_NOT_APPLIED]}
  rationale: >-
    A travel ban alone freezes nothing, so the UK and EU packs do not apply it:
    it seeds nothing, and the memo lists it as not applied, a gap that never
    decides. OFAC blocks every program on its list.

- id: PACK-22
  title: the right to appoint the board, held by a designated person
  target: T
  edges:
    - {upper: A, lower: T, rel: CONTROLS, basis: board_appointment}
  designations:
    - {node: A}
  expected:
    ofac: {recommendation: REVIEW, reasons: [CONTROL_LINK], blocked: [A]}
    uk_ofsi: {recommendation: ESCALATE, reasons: [CONTROL_LINK], blocked: [A, T]}
    eu: {recommendation: ESCALATE, reasons: [CONTROL_LINK], blocked: [A, T]}
  rationale: >-
    The UK and EU tests cover control, and these packs block on the right to
    appoint the board: the controlled entity is blocked (basis CONTROL), and
    the control link is the reason. OFAC's rule is ownership only; control is
    reviewed.

- id: PACK-23
  title: significant influence, held by a designated person
  target: T
  edges:
    - {upper: A, lower: T, rel: CONTROLS, basis: significant_influence}
  designations:
    - {node: A}
  expected:
    ofac: {recommendation: REVIEW, reasons: [CONTROL_LINK], blocked: [A]}
    uk_ofsi: {recommendation: REVIEW, reasons: [CONTROL_LINK], blocked: [A]}
    eu: {recommendation: REVIEW, reasons: [CONTROL_LINK], blocked: [A]}
  rationale: >-
    Influence is weaker than the right to appoint the board: no pack blocks on
    it, and every pack sends it to a reviewer.

- id: PACK-24
  title: two designated brothers with 30 % each
  target: T
  edges:
    - {upper: A, lower: T, pct: 30}
    - {upper: B, lower: T, pct: 30}
    - {upper: A, lower: B, rel: RELATED_TO, basis: family}
  designations:
    - {node: A}
    - {node: B}
  expected:
    ofac: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, B, T]}
    uk_ofsi: {recommendation: REVIEW, reasons: [EFFECTIVE_EXPOSURE, POSSIBLY_BLOCKED], blocked: [A, B], possibly_blocked: [T]}
    eu: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, B, T]}
  rationale: >-
    The UK pack tests the largest holding (30 %), but the two holders are
    family, and together they hold 60 %: possibly blocked (basis
    RELATED_AGGREGATE), since a relation alone does not prove a joint
    arrangement. OFAC and the EU pack add every designated holder's stake.

- id: PACK-25
  title: two designated associates with 30 % each
  target: T
  edges:
    - {upper: A, lower: T, pct: 30}
    - {upper: B, lower: T, pct: 30}
    - {upper: B, lower: A, rel: RELATED_TO, basis: associate}
  designations:
    - {node: A}
    - {node: B}
  expected:
    ofac: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, B, T]}
    uk_ofsi: {recommendation: REVIEW, reasons: [EFFECTIVE_EXPOSURE, POSSIBLY_BLOCKED], blocked: [A, B], possibly_blocked: [T]}
    eu: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, B, T]}
  rationale: >-
    As PACK-24, for associates; the relation is the same whichever end it is
    written from.

- id: PACK-26
  title: two unrelated designated holders with 30 % each
  target: T
  edges:
    - {upper: A, lower: T, pct: 30}
    - {upper: B, lower: T, pct: 30}
  designations:
    - {node: A}
    - {node: B}
  expected:
    ofac: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, B, T]}
    uk_ofsi: {recommendation: REVIEW, reasons: [EFFECTIVE_EXPOSURE], blocked: [A, B]}
    eu: {recommendation: ESCALATE, reasons: [DERIVED_50PCT], blocked: [A, B, T]}
  rationale: >-
    Without a relation between them, the UK pack does not consider the two
    holdings together: the target is not possibly blocked. The combined
    exposure (60 %) is still a risk signal for a reviewer, as in PACK-03.

- id: PACK-27
  title: a relation to a designated person outside the upward graph
  target: T
  edges:
    - {upper: A, lower: T, pct: 20}
    - {upper: X, lower: Y, pct: 60}
    - {upper: A, lower: X, rel: RELATED_TO, basis: family}
  designations:
    - {node: A}
    - {node: X}
  expected:
    ofac: {recommendation: CLEAR, blocked: [A]}
    uk_ofsi: {recommendation: CLEAR, blocked: [A]}
    eu: {recommendation: CLEAR, blocked: [A]}
  rationale: >-
    X holds nothing above the target, so the relation is never walked and adds
    nothing: neither X nor what it owns enters the graph the rules read.
