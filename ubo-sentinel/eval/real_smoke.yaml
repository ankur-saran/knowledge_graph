# Real-data smoke entries: invariants that hold on any refresh (`ubo eval --suite real-smoke`).
#
# Real results move with every publish, so an entry states what must stay true
# (`expect`) and keeps the recommendation it had on the set it was verified on.
# On that set a different recommendation fails the suite; on a newer set it is
# reported as drift. LEIs and names are GLEIF's (CC0); which lists designate
# them comes from OpenSanctions (CC BY-NC 4.0) and is summarised, not copied.
# `ubo bench --lei-file eval/real_smoke.yaml` screens the entries with an LEI.

