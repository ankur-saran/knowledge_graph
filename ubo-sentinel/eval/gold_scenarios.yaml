# Gold scenarios: what the rule engine must conclude for each fixture target, and why.
# Schema and loader: ubo_sentinel.models.gold_scenario. Fixtures: fixtures/README.md.
# Node ids are canonical entity ids. Edge ids are never written here; a path gives
# its nodes and the relation of each hop, and the loader derives the ids.

- id: SCEN-01
  query: Acme Trading FZE
  target_id: lei:FXS01TARGET000000000
  expected_recommendation: CLEAR
  expected_recommendation_t1: ESCALATE
  rationale: No owner is designated and every percentage is known. On the changed list the 60 % parent
    is designated, so the target becomes derived-blocked.

