[project]
name = "ubo-sentinel"
version = "0.1.0"
description = "Knowledge-graph-driven beneficial ownership and sanctions exposure screening"
readme = "README.md"
authors = [
    { name = "ankur-saran", email = "ankur.mechengr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "networkx>=3.7",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "typer>=0.27.2",
]

[project.scripts]
ubo = "ubo_sentinel.cli.app:app"

[project.optional-dependencies]
ui = [
    "pyvis>=0.3.2",
    "streamlit>=1.64.0",
]
optional = [
    "anthropic>=1.11.0",
    "neo4j>=6.3.1",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
